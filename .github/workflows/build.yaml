name: Build, Deploy and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # v1.0.0 などのタグプッシュで Release ジョブを起動
  workflow_dispatch:

concurrency:
  group: "pages-and-release"
  cancel-in-progress: true

jobs:
  # 1. WASM エンジンのビルド
  goboscript-wasm:
    name: Build Goboscript WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goboscript Repository
        uses: actions/checkout@v4
        with:
          repository: aspizu/goboscript
          path: goboscript

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "-A warnings"

      - name: Build Goboscript WASM
        run: |
          cd goboscript
          # ブラウザでの利用を想定し --target web を採用
          wasm-pack build --release --target web

      - name: Upload Goboscript WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goboscript-wasm
          path: goboscript/pkg

  # 2. メインプロジェクトのビルドと Pages 準備
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: goboscript-wasm
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Download Goboscript WASM Artifact
        uses: actions/download-artifact@v4
        with:
          name: goboscript-wasm
          # あなたのフォルダ構造に合わせて media/goboscript に配置
          path: media/goboscript

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./dist

  # 4. GitHub Releases への自動投稿（タグプッシュ時のみ実行）
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [goboscript-wasm, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: goboscript-wasm
          path: release_pkg

      - name: Archive WASM for Release
        run: |
          tar -czvf goboscript-wasm-assets.tar.gz -C release_pkg .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            goboscript-wasm-assets.tar.gz
            release_pkg/goboscript_bg.wasm
            release_pkg/goboscript.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
