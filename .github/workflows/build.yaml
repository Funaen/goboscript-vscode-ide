name: Build and Package Goboscript Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  build-and-vsix:
    name: Build WASM and Package VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Goboscript WASM Repository
        uses: actions/checkout@v4
        with:
          repository: aspizu/goboscript
          path: goboscript_src

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "nightly-2026-01-19"
          rustflags: "-A warnings"
          cache-workdir: "goboscript_src"

      - name: Build Goboscript WASM
        run: |
          cd goboscript_src
          sed -i 's/wasm-opt = \[.*\]/wasm-opt = false/' Cargo.toml
          # ブラウザ/拡張機能向けに --target web でビルド
          wasm-pack build --release --target web

      - name: Prepare Extension Folder Structure
        run: | 
          # 2. ビルド成果物を指定の場所にコピー (ファイル名を標準的なものに調整)
          # pkg内のファイル名はCargo.tomlに依存するため、cpでリネームしつつ配置
          cp goboscript_src/pkg/libgoboscript_bg.wasm media/goboscript/libgoboscript_bg.wasm
          cp goboscript_src/pkg/libgoboscript.js media/goboscript/libgoboscript.js
          
          # 3. 作業用の一時フォルダ 'extension' を作成し、中身をコピー
          mkdir -p extension
          # 必要なファイル・フォルダをすべて extension/ に集約
          cp -r media src package.json README.md extension/

      - name: Create VSIX Package
        run: |
          # extension フォルダを zip 圧縮し、gside.vsix に改名
          zip -r gside.zip extension
          mv gside.zip gside.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gside.vsix
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
