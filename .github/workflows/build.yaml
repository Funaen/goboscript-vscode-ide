name: Build and Package Goboscript Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  build-and-vsix:
    name: Build WASM and Package VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Checkout Goboscript WASM Repository
        uses: actions/checkout@v4
        with:
          repository: aspizu/goboscript
          path: goboscript_src
      - name: Patch wasm.rs
        run: |
          cat <<'EOF' > goboscript_src/src/wasm.rs
          use std::{
              cell::RefCell,
              io::Cursor,
              rc::Rc,
          };

          use semver::Version;
          use serde::{
              Deserialize,
              Serialize,
          };
          use tsify::Tsify;
          use wasm_bindgen::{
              prelude::*,
              JsValue,
          };

          use crate::{
              ast::Sprite,
              codegen::sb3::Sb3,
              diagnostic::{
                  Artifact,
                  Diagnostic,
              },
              frontend::build::build_impl,
              misc::base64,
              standard_library::StandardLibrary,
              vfs::MemFS,
          };

          #[derive(Tsify, Serialize, Deserialize)]
          #[tsify(into_wasm_abi, from_wasm_abi)]
          pub struct Build {
              #[serde(with = "base64")]
              file: Vec<u8>,
              artifact: Artifact,
          }

          #[wasm_bindgen]
          pub fn build(fs: JsValue) -> JsValue {
              let fs: MemFS = serde_wasm_bindgen::from_value(fs).unwrap();
              let fs = Rc::new(RefCell::new(fs));
              let mut file = Vec::new();
              let sb3 = Sb3::new(Cursor::new(&mut file), fs.clone(), "project".into());
              let stdlib = StandardLibrary {
                  path: "stdlib".into(),
                  version: Version::new(0, 0, 0),
              };
              let artifact = build_impl(fs, "project".into(), sb3, Some(stdlib)).unwrap();
              serde_wasm_bindgen::to_value(&Build { file, artifact }).unwrap()
          }

          use wasm_bindgen::prelude::*;
          use serde_json;

          #[wasm_bindgen]
          pub fn diagnostic_to_string(
              diagnostic: JsValue,
              sprite_json: String,
          ) -> String {
              let sprite: Sprite = match serde_json::from_str(&sprite_json) {
                  Ok(s) => s,
                  Err(e) => return format!("Sprite JSON deserialize error: {}", e),
              };

              let diagnostic: Diagnostic =
                  match serde_wasm_bindgen::from_value(diagnostic) {
                      Ok(d) => d,
                      Err(e) => return format!("Diagnostic deserialize error: {}", e),
                  };

              diagnostic_to_string_internal(&diagnostic, &sprite)
          }
          EOF
      - name: Debug wasm.rs
        run: |
          echo "===== wasm.rs ====="
          cat goboscript_src/src/wasm.rs
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "nightly-2026-01-19"
          rustflags: "-A warnings"
          cache-workdir: "goboscript_src"

      - name: Build Goboscript WASM
        run: |
          cd goboscript_src
          sed -i 's/wasm-opt = \[.*\]/wasm-opt = false/' Cargo.toml
          wasm-pack build --release --target web

      - name: Prepare Extension Folder Structure
        run: |
          mkdir -p media/goboscript
          cp goboscript_src/pkg/libgoboscript_bg.wasm media/goboscript/libgoboscript_bg.wasm
          cp goboscript_src/pkg/libgoboscript.js media/goboscript/libgoboscript.js
          mkdir -p extension
          cp -r media src package.json README.md extension/

      - name: Create VSIX Package
        run: |
          zip -r gside.zip extension
          mv gside.zip gside.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goboscript-extension-vsix
          path: gside.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gside.vsix
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
